{% extends "base.html" %}

{% block content %}
  <h1>
    Name: {{ team.name }}
    <a href="{% url 'task:team-delete' pk=team.id %}" class="btn btn-danger link-to-page">
      Delete
    </a>

    <a href="{% url 'task:team-update' pk=team.id %}" class="btn btn-secondary link-to-page">
      Update Team
    </a>
  </h1>
  <h4>Workers</h4>

  {% for member in team.members.all %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Last Name</th>
        <th>Position</th>
      </tr>
      <tr>
        <td>{{ member.id }}</td>
        <td>
          <a href="{% url "task:worker-detail" pk=member.id %}">{{ member.last_name }}</a>
        </td>
        <td>{{ member.position }}</td>
      </tr>
    </table>
  {% empty %}
      <p>No tasks!</p>
  {% endfor %}
{% endblock %}
